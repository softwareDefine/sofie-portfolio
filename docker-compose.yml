services:
  nginx:
    image: nginx:alpine
    container_name: sofie-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # 디렉토리 마운트 — git reset이 파일을 교체해도 컨테이너에 반영됨 (파일 마운트는 inode 고정 함정)
      - ./nginx:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - app
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    container_name: sofie-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot

  app:
    build: .
    container_name: sofie-portfolio
    restart: unless-stopped
    ports:
      # LAN 직접 접근용 (admin 내부망 접속 + 헬스체크)
      - "${PORT:-8080}:3000"
    environment:
      # 외부 DB 쓰려면 .env에서 DATABASE_URL만 바꾸면 됨
      DATABASE_URL: ${DATABASE_URL:-postgres://sofie:sofie@db:5432/sofie_portfolio}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
      SESSION_SECRET: ${SESSION_SECRET:-}
      OTP_SECRET: ${OTP_SECRET:-}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      # 운영 콘솔이 경력/프로젝트를 쓰기 위해 쓰는 내부 토큰
      SERVICE_TOKEN: ${SERVICE_TOKEN:-}
      CONSOLE_URL: ${CONSOLE_URL:-https://console.sofie.co.kr/}
      # 1 이면 옛 admin 화면이 다시 열린다 (사설망 + 비밀번호 뒤)
      LEGACY_ADMIN: ${LEGACY_ADMIN:-0}
      # 연차 계산 기준 연도
      CAREER_START_YEAR: ${CAREER_START_YEAR:-2013}
      RESET_EMAIL: ${RESET_EMAIL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - uploads:/app/public/uploads
    depends_on:
      - db

  db:
    image: postgres:17-alpine
    container_name: sofie-portfolio-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sofie
      POSTGRES_PASSWORD: sofie
      POSTGRES_DB: sofie_portfolio
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
  uploads:
