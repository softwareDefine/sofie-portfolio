server {
    listen 80;
    server_name sofie.co.kr www.sofie.co.kr portfolio.sofie.co.kr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# portfolio.sofie.co.kr — 포트폴리오 (이 레포의 Express 앱)
server {
    listen 443 ssl;
    server_name portfolio.sofie.co.kr;

    ssl_certificate /etc/letsencrypt/live/portfolio.sofie.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portfolio.sofie.co.kr/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 갤러리 이미지·배경 영상 업로드 (앱 제한 100MB와 맞춤)
    client_max_body_size 120m;

    # 앱 컨테이너 재시작으로 IP가 바뀌어도 502 안 나게 매 요청 DNS 재조회
    resolver 127.0.0.11 valid=10s;
    set $app_upstream http://app:3000;

    location / {
        proxy_pass $app_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# sofie.co.kr — 기업 소개 사이트 (sofie-company 레포의 정적 컨테이너)
server {
    listen 443 ssl;
    server_name sofie.co.kr www.sofie.co.kr;

    ssl_certificate /etc/letsencrypt/live/sofie.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sofie.co.kr/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 포트폴리오가 루트에 있던 시절 밖에 뿌려진 링크 — 새 주소로 영구 이동
    location ~ ^/(project|career)/\d+$ {
        return 301 https://portfolio.sofie.co.kr$request_uri;
    }
    location /uploads/ {
        return 301 https://portfolio.sofie.co.kr$request_uri;
    }

    resolver 127.0.0.11 valid=10s;
    set $company_upstream http://sofie-company:80;

    location / {
        proxy_pass $company_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
