name: Deploy to Mac mini

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, mac-mini]
    steps:
      - name: Pull latest code
        run: |
          cd /Users/juholee/servers/sofie-portfolio
          git fetch origin master
          git reset --hard origin/master

      - name: Rebuild and restart containers
        run: |
          cd /Users/juholee/servers/sofie-portfolio
          docker compose up -d --build

      - name: Reload nginx config
        run: |
          docker exec sofie-nginx nginx -t && docker exec sofie-nginx nginx -s reload

      - name: Health check
        run: |
          cd /Users/juholee/servers/sofie-portfolio
          [ -f .env ] && export $(grep -E '^PORT=' .env | xargs) || true
          sleep 8
          curl -sf http://localhost:${PORT:-8080}/api/content > /dev/null && echo "OK"

      - name: Show running containers
        run: docker ps --filter "name=sofie-portfolio" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
