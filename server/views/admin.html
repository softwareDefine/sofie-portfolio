<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>sofie admin</title>
<link rel="icon" type="image/svg+xml" href="/%EC%86%8C%ED%94%BC%EB%A1%9C%EA%B3%A0.svg">
<link href="https://hangeul.pstatic.net/hangeul_static/css/NanumSquare Neo.css" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{font-family:'NanumSquare Neo',-apple-system,sans-serif;background:#0b0f1a;color:#fff;min-height:100vh;-webkit-font-smoothing:antialiased}
a{color:#7eb8ff}
.wrap{max-width:980px;margin:0 auto;padding:40px 24px}
h1{font-size:1.4rem;font-weight:700;margin-bottom:4px}
.sub{font-size:.75rem;color:rgba(255,255,255,.3);margin-bottom:28px}

/* login */
#loginView{min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
#loginView.hidden{display:none}
#loginView::before{
    content:'';position:absolute;width:560px;height:560px;border-radius:50%;
    background:radial-gradient(circle, rgba(100,180,255,.07) 0%, transparent 65%);
    pointer-events:none;
}
.login-box{
    position:relative;width:100%;max-width:340px;margin:0 20px;
    display:flex;flex-direction:column;gap:10px;
    animation:loginUp .5s ease;
}
@keyframes loginUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.login-box img{height:34px;margin:0 auto 4px;display:block}
.login-sub{font-size:.62rem;letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.25);text-align:center;margin-bottom:22px}
.login-box input{padding:12px 14px;border-radius:10px;background:rgba(255,255,255,.035)}
.login-box input:focus{border-color:rgba(100,180,255,.45);box-shadow:0 0 0 3px rgba(100,180,255,.08)}
.login-box .btn-pri{padding:12px;border-radius:10px;margin-top:4px;font-size:.85rem}
.login-reset{
    margin-top:14px;text-align:center;font-size:.7rem;
    color:rgba(255,255,255,.28);background:none;border:none;padding:4px;
    text-decoration:underline;text-underline-offset:3px;text-decoration-color:rgba(255,255,255,.12);
    transition:color .2s;
}
.login-reset:hover{color:rgba(255,255,255,.6)}

/* common controls */
input,select,textarea,button{font-family:inherit;font-size:.82rem;color:#fff;outline:none}
input,textarea{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:9px 12px;width:100%;transition:border-color .2s}
input:focus,textarea:focus{border-color:rgba(100,180,255,.4)}
input[type=checkbox]{width:auto;accent-color:#7eb8ff;cursor:pointer}
input[type=number]{width:90px}
button{cursor:pointer;border:none;border-radius:8px;padding:9px 16px;font-weight:600;transition:all .2s}
.btn-pri{background:#fff;color:#111}
.btn-pri:hover{background:rgba(255,255,255,.85)}
.btn-ghost{background:rgba(255,255,255,.06);color:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.08)}
.btn-ghost:hover{background:rgba(255,255,255,.12)}
.btn-danger{background:rgba(255,80,80,.12);color:#ff7b7b}
.btn-danger:hover{background:rgba(255,80,80,.25)}
.btn-sm{padding:5px 10px;font-size:.72rem;border-radius:6px}

/* tabs */
.tabs{display:flex;gap:6px;margin-bottom:24px;flex-wrap:wrap}
.tab{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);color:rgba(255,255,255,.5);border-radius:100px;padding:8px 20px;font-size:.8rem}
.tab.active{background:#fff;color:#111;font-weight:700}
.topbar{display:flex;justify-content:space-between;align-items:flex-start}

/* list rows */
.row{display:flex;gap:8px;align-items:center;padding:10px 14px;border-radius:10px;background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.05);margin-bottom:6px}
.row:hover{background:rgba(255,255,255,.05)}
.row.dragging{opacity:.35;border-color:rgba(100,180,255,.5)}
.handle{cursor:grab;color:rgba(255,255,255,.25);font-size:.9rem;padding:4px 6px;user-select:none;letter-spacing:-2px}
.handle:hover{color:rgba(255,255,255,.6)}
.handle:active{cursor:grabbing}
.row .grow{flex:1;min-width:0}
.row .title{font-size:.85rem;color:rgba(255,255,255,.85);word-break:break-all}
.row .meta{font-size:.68rem;color:rgba(255,255,255,.3);margin-top:2px}
.badge{font-size:.6rem;font-weight:700;padding:2px 8px;border-radius:100px;background:rgba(255,217,61,.12);color:#ffd93d;white-space:nowrap}
.yr-head{font-size:1rem;font-weight:700;color:#7eb8ff;margin:22px 0 8px}
.thumb{width:54px;height:38px;object-fit:cover;border-radius:6px;border:1px solid rgba(255,255,255,.08)}
.thumb-ph{width:54px;height:38px;border-radius:6px;background:rgba(255,255,255,.04);display:flex;align-items:center;justify-content:center;font-size:.6rem;color:rgba(255,255,255,.2)}
.tags span{font-size:.6rem;padding:2px 7px;border-radius:4px;background:rgba(100,180,255,.08);color:#7eb8ff;margin-right:3px}

/* upload */
.file-hidden{display:none}
.upload-btn{
    display:inline-flex;align-items:center;gap:7px;
    padding:8px 16px;border-radius:8px;font-size:.74rem;font-weight:600;
    background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);
    color:rgba(255,255,255,.65);cursor:pointer;transition:all .2s;
}
.upload-btn:hover{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.18)}
.dropzone{
    border:1.5px dashed rgba(255,255,255,.14);border-radius:10px;
    padding:20px 14px;text-align:center;cursor:pointer;transition:all .2s;
    font-size:.72rem;color:rgba(255,255,255,.3);
}
.dropzone:hover{border-color:rgba(100,180,255,.4);color:rgba(255,255,255,.5);background:rgba(100,180,255,.03)}
.dropzone.dragover{border-color:#7eb8ff;background:rgba(100,180,255,.08);color:#7eb8ff}
.dropzone .dz-ic{font-size:1.3rem;display:block;margin-bottom:6px;opacity:.6}
.dropzone.busy{pointer-events:none;opacity:.5}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);display:none;align-items:flex-start;justify-content:center;z-index:50;overflow-y:auto;padding:8vh 16px}
.modal-bg.open{display:flex}
.modal{background:#11182a;border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:26px;width:100%;max-width:460px}
#projectModal .modal,#careerModal .modal{max-width:580px}
.modal h2{font-size:1rem;margin-bottom:18px}
.field{margin-bottom:12px}
.field label{display:block;font-size:.7rem;color:rgba(255,255,255,.4);margin-bottom:5px}
.field .inline{display:flex;align-items:center;gap:8px}
.modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}

/* stats */
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:560px}
.stat-card{padding:18px;border-radius:12px;background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.05)}
.stat-card label{display:block;font-size:.72rem;color:rgba(255,255,255,.4);margin-bottom:8px}
.stat-card input{font-size:1.4rem;font-weight:800;width:100%}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1c2840;border:1px solid rgba(100,180,255,.3);border-radius:10px;padding:10px 22px;font-size:.8rem;opacity:0;transition:opacity .3s;pointer-events:none;z-index:99}
.toast.show{opacity:1}
.hidden{display:none}
@media(max-width:640px){.stats-grid{grid-template-columns:1fr}.row{flex-wrap:wrap}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginView" class="hidden">
    <div class="login-box">
        <img src="소피로고.svg" alt="sofie">
        <div class="login-sub">Admin Console</div>
        <input type="password" id="pw" placeholder="비밀번호" autocomplete="current-password">
        <input type="text" id="otp" placeholder="OTP 6자리" inputmode="numeric" pattern="\d{6}" maxlength="6" autocomplete="one-time-code" class="hidden" style="text-align:center;letter-spacing:.4em">
        <button class="btn-pri" id="loginBtn">로그인</button>
        <p id="loginErr" style="font-size:.72rem;color:#ff7b7b;text-align:center"></p>
        <button class="login-reset" onclick="openResetModal()">비밀번호 · OTP를 잊으셨나요?</button>
    </div>
</div>

<!-- ADMIN -->
<div id="adminView" class="wrap hidden">
    <div class="topbar">
        <div>
            <h1><img src="소피로고.svg" alt="sofie" style="height:30px;vertical-align:-6px"> admin</h1>
            <p class="sub">포트폴리오 콘텐츠 관리 · <a href="/" target="_blank">사이트 보기 ↗</a></p>
        </div>
        <button class="btn-ghost btn-sm" id="logoutBtn">로그아웃</button>
    </div>

    <div class="tabs">
        <button class="tab active" data-tab="careers">세부경력</button>
        <button class="tab" data-tab="projects">프로젝트</button>
        <button class="tab" data-tab="about">약력</button>
        <button class="tab" data-tab="site">사이트</button>
        <button class="tab" data-tab="stats">스탯</button>
    </div>

    <!-- CAREERS -->
    <div id="tab-careers">
        <button class="btn-pri" onclick="openCareerModal()">+ 경력 추가</button>
        <div id="careerList"></div>
    </div>

    <!-- PROJECTS -->
    <div id="tab-projects" class="hidden">
        <button class="btn-pri" onclick="openProjectModal()">+ 프로젝트 추가</button>
        <div id="projectList" style="margin-top:16px"></div>
    </div>

    <!-- ABOUT -->
    <div id="tab-about" class="hidden">
        <div style="max-width:640px;display:flex;flex-direction:column;gap:14px">
            <div class="field" style="margin:0">
                <label>프로필 사진</label>
                <div class="inline">
                    <img id="a_photoPreview" class="hidden" style="width:72px;height:72px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.1)" alt="">
                    <label class="upload-btn" for="a_photo">&#128247; 사진 선택</label>
                    <input type="file" id="a_photo" accept="image/*" class="file-hidden">
                </div>
            </div>
            <div class="field" style="margin:0"><label>헤드라인</label><input type="text" id="a_headline"></div>
            <div class="field" style="margin:0"><label>소개글</label><textarea id="a_intro" rows="4"></textarea></div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
                <div class="field" style="margin:0"><label>전화번호</label><input type="text" id="a_phone"></div>
                <div class="field" style="margin:0"><label>이메일</label><input type="text" id="a_email"></div>
            </div>
            <div class="field" style="margin:0">
                <label>약력 표 — 값은 여러 줄 가능, 링크는 [텍스트](URL)</label>
                <div id="a_rows" style="display:flex;flex-direction:column;gap:8px"></div>
                <button class="btn-ghost btn-sm" style="margin-top:8px" onclick="addAboutRow()">+ 항목 추가</button>
            </div>
            <div><button class="btn-pri" onclick="saveAbout()">저장</button></div>
        </div>
    </div>

    <!-- SITE (히어로/배경영상/기술스택) -->
    <div id="tab-site" class="hidden">
        <div style="max-width:640px;display:flex;flex-direction:column;gap:14px">
            <div class="field" style="margin:0"><label>히어로 제목</label><input type="text" id="s_heroTitle"></div>
            <div class="field" style="margin:0"><label>히어로 설명</label><input type="text" id="s_heroDesc"></div>
            <div class="field" style="margin:0">
                <label>운영 채널 링크 (히어로·푸터에 표시 — 블로그, GitHub 등)</label>
                <div id="s_links" style="display:flex;flex-direction:column;gap:8px"></div>
                <button class="btn-ghost btn-sm" style="margin-top:8px" onclick="addSiteLink()">+ 링크 추가</button>
            </div>
            <div class="field" style="margin:0">
                <label>배경 동영상 (위에서부터 순서대로 순환 재생)</label>
                <div id="s_videoList" style="display:flex;flex-direction:column;gap:6px;margin-bottom:8px"></div>
                <label class="upload-btn" for="s_video">&#127916; 동영상 업로드</label>
                <input type="file" id="s_video" accept="video/mp4,video/webm,video/quicktime" multiple class="file-hidden">
                <span id="s_videoBusy" class="hidden" style="font-size:.7rem;color:#7eb8ff;margin-left:8px">업로드 중...</span>
            </div>
            <div class="field" style="margin:0">
                <label>기술 스택 — 한 줄이 마키 한 줄, 항목은 쉼표로 구분 ("이모지 이름" 형식)</label>
                <textarea id="s_skills" rows="5" placeholder="⚙️ C/C++, ⚡ JS, 🐍 Python&#10;🚀 Express, ☁️ AWS"></textarea>
            </div>
            <div><button class="btn-pri" onclick="saveSite()">저장</button></div>
        </div>
    </div>

    <!-- STATS -->
    <div id="tab-stats" class="hidden">
        <div class="stats-grid">
            <div class="stat-card"><label>경력을 시작한지 (년)</label><input type="number" id="stat_years"></div>
            <div class="stat-card"><label>프로젝트의 수 (개)</label><input type="number" id="stat_projects"></div>
            <div class="stat-card"><label>코딩 대외활동 (개)</label><input type="number" id="stat_activities"></div>
        </div>
        <button class="btn-pri" style="margin-top:14px" onclick="saveStats()">저장</button>
    </div>
</div>

<!-- CAREER MODAL -->
<div class="modal-bg" id="careerModal">
    <div class="modal">
        <h2 id="careerModalTitle">경력 추가</h2>
        <div class="field"><label>연도</label><input type="number" id="c_year"></div>
        <div class="field"><label>내용</label><input type="text" id="c_title"></div>
        <div class="field"><div class="inline"><input type="checkbox" id="c_featured"><label for="c_featured" style="margin:0;cursor:pointer">핵심경력에 표시 (메인에서 굵게 강조)</label></div></div>
        <div class="field">
            <label>갤러리 이미지 (상세 팝업용, 여러 장 가능)</label>
            <div id="c_galleryList" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px"></div>
            <div class="dropzone" id="c_dropzone">
                <span class="dz-ic">&#128228;</span>
                클릭하거나 이미지를 끌어다 놓으세요
            </div>
            <input type="file" id="c_gallery" accept="image/*" multiple class="file-hidden">
        </div>
        <div class="field">
            <label>상세 내용 (마크다운 — 작성하면 메인에서 클릭해 볼 수 있음)</label>
            <textarea id="c_content" rows="8" placeholder="## 활동 내용&#10;..." style="font-family:Consolas,monospace;font-size:.78rem;line-height:1.6"></textarea>
        </div>
        <div class="actions">
            <button class="btn-ghost" onclick="closeModal('careerModal')">취소</button>
            <button class="btn-pri" id="careerSaveBtn">저장</button>
        </div>
    </div>
</div>

<!-- PROJECT MODAL -->
<div class="modal-bg" id="projectModal">
    <div class="modal">
        <h2 id="projectModalTitle">프로젝트 추가</h2>
        <div class="field"><label>연도</label><input type="number" id="p_year"></div>
        <div class="field"><label>제목</label><input type="text" id="p_title"></div>
        <div class="field"><label>설명</label><textarea id="p_desc" rows="2"></textarea></div>
        <div class="field"><label>태그 (쉼표로 구분)</label><input type="text" id="p_tags" placeholder="Python, AI/ML, 팀장"></div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">
            <div class="field"><label>분야</label><input type="text" id="p_field" list="fieldList" placeholder="서버, 앱..."></div>
            <div class="field"><label>목적</label><input type="text" id="p_purpose" list="purposeList" placeholder="대회, 전시..."></div>
            <div class="field"><label>수상 (수상작만)</label><input type="text" id="p_award" placeholder="은상, 장려상..."></div>
        </div>
        <datalist id="fieldList"></datalist>
        <datalist id="purposeList"></datalist>
        <div class="field"><div class="inline"><input type="checkbox" id="p_featured"><label for="p_featured" style="margin:0;cursor:pointer">대표 프로젝트 (메인에 기본 노출 ★)</label></div></div>
        <div class="field"><label>링크 URL (선택)</label><input type="text" id="p_link" placeholder="https://..."></div>
        <div class="field">
            <label>썸네일 이미지 (카드에 표시)</label>
            <div class="inline">
                <img id="p_preview" class="thumb hidden" alt="">
                <label class="upload-btn" for="p_image">&#128247; 이미지 선택</label>
                <input type="file" id="p_image" accept="image/*" class="file-hidden">
                <button class="btn-ghost btn-sm hidden" id="p_imgRemove" onclick="removeImage()">제거</button>
            </div>
        </div>
        <div class="field">
            <label>갤러리 이미지 (상세페이지, 여러 장 가능)</label>
            <div id="p_galleryList" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px"></div>
            <div class="dropzone" id="p_dropzone">
                <span class="dz-ic">&#128228;</span>
                클릭하거나 이미지를 끌어다 놓으세요
            </div>
            <input type="file" id="p_gallery" accept="image/*" multiple class="file-hidden">
        </div>
        <div class="field">
            <label>본문 (마크다운 — 상세페이지에 렌더링)</label>
            <textarea id="p_content" rows="10" placeholder="## 개요&#10;프로젝트 설명...&#10;&#10;## 내 역할&#10;- 백엔드 설계&#10;..." style="font-family:Consolas,monospace;font-size:.78rem;line-height:1.6"></textarea>
        </div>
        <div class="actions">
            <button class="btn-ghost" onclick="closeModal('projectModal')">취소</button>
            <button class="btn-pri" id="projectSaveBtn">저장</button>
        </div>
    </div>
</div>

<!-- RESET MODAL -->
<div class="modal-bg" id="resetModal">
    <div class="modal">
        <h2>비밀번호 · OTP 재설정</h2>

        <div id="resetStep1">
            <p style="font-size:.78rem;color:rgba(255,255,255,.45);line-height:1.7;margin-bottom:16px">
                등록된 이메일로 6자리 인증코드를 보냅니다.<br>코드는 10분 동안 유효합니다.
            </p>
            <div class="actions">
                <button class="btn-ghost" onclick="closeModal('resetModal')">취소</button>
                <button class="btn-pri" id="resetSendBtn">인증코드 발송</button>
            </div>
        </div>

        <div id="resetStep2" class="hidden">
            <p id="resetSentTo" style="font-size:.72rem;color:#7eb8ff;margin-bottom:14px"></p>
            <div class="field"><label>인증코드 6자리</label><input type="text" id="r_code" inputmode="numeric" maxlength="6" style="text-align:center;letter-spacing:.4em"></div>
            <div class="field"><label>새 비밀번호 (바꾸려면 입력, 8자 이상)</label><input type="password" id="r_pw" autocomplete="new-password"></div>
            <div class="field"><div class="inline"><input type="checkbox" id="r_regenOtp"><label for="r_regenOtp" style="margin:0;cursor:pointer">OTP 재발급 (새 키 생성)</label></div></div>
            <div class="actions">
                <button class="btn-ghost" onclick="closeModal('resetModal')">취소</button>
                <button class="btn-pri" id="resetConfirmBtn">재설정</button>
            </div>
        </div>

        <div id="resetStep3" class="hidden">
            <p style="font-size:.85rem;color:#6bcb77;margin-bottom:12px">✓ 재설정 완료</p>
            <div id="resetOtpResult" class="hidden">
                <p style="font-size:.74rem;color:rgba(255,255,255,.5);line-height:1.7;margin-bottom:8px">
                    새 OTP 키 — Google Authenticator에서 기존 sofie-admin 삭제 후 아래 키로 다시 등록해:
                </p>
                <code id="resetOtpSecret" style="display:block;padding:10px;border-radius:8px;background:rgba(255,255,255,.05);font-size:.78rem;word-break:break-all;margin-bottom:14px;color:#ffd93d"></code>
            </div>
            <div class="actions">
                <button class="btn-pri" onclick="closeModal('resetModal')">닫기</button>
            </div>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
let careers=[], projects=[], settings={};

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800);}

async function api(path,opts={}){
    const res=await fetch('/api'+path,{headers:{'Content-Type':'application/json'},...opts});
    const data=await res.json().catch(()=>({}));
    if(!res.ok){
        // 세션 만료 시 로그인 화면으로 (로그인 시도 자체의 401은 제외)
        if(res.status===401&&path!=='/login')showLogin();
        throw new Error(data.error||('HTTP '+res.status));
    }
    return data;
}

/* ─── drag & drop 정렬 ─── */
let dragEl=null;
function attachDrag(group,endpoint){
    group.querySelectorAll('.row').forEach(row=>{
        const handle=row.querySelector('.handle');
        handle.addEventListener('mousedown',()=>row.draggable=true);
        handle.addEventListener('touchstart',()=>row.draggable=true,{passive:true});
        row.addEventListener('dragstart',()=>{dragEl=row;row.classList.add('dragging');});
        row.addEventListener('dragend',async()=>{
            row.classList.remove('dragging');row.draggable=false;
            if(!dragEl)return;
            dragEl=null;
            const ids=[...group.querySelectorAll('.row')].map(r=>+r.dataset.id);
            try{await api(endpoint,{method:'PUT',body:JSON.stringify({ids})});toast('순서 저장됨');loadAll();}
            catch(e){toast(e.message);loadAll();}
        });
        row.addEventListener('dragover',e=>{
            if(!dragEl||dragEl===row||dragEl.parentElement!==row.parentElement)return;
            e.preventDefault();
            const rect=row.getBoundingClientRect();
            const after=(e.clientY-rect.top)>rect.height/2;
            row.parentElement.insertBefore(dragEl,after?row.nextSibling:row);
        });
        row.addEventListener('drop',e=>e.preventDefault());
    });
}

// 공용 다중 업로드: files → /api/upload → arr에 push
async function uploadImagesTo(files,arr,dzEl,renderFn){
    files=[...files].filter(f=>f.type.startsWith('image/'));
    if(!files.length)return;
    dzEl.classList.add('busy');
    let ok=0;
    for(const file of files){
        const fd=new FormData();fd.append('image',file);
        try{
            const res=await fetch('/api/upload',{method:'POST',body:fd});
            const data=await res.json();
            if(!res.ok)throw new Error(data.error||'업로드 실패');
            arr.push(data.url);ok++;
        }catch(err){toast(file.name+': '+err.message);}
    }
    dzEl.classList.remove('busy');
    renderFn();
    if(ok)toast('갤러리 '+ok+'장 업로드됨');
}
// 드롭존 + 파일 인풋 연결
function wireDropzone(dzId,inputId,handler){
    const dz=document.getElementById(dzId), inp=document.getElementById(inputId);
    dz.onclick=()=>inp.click();
    dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('dragover');});
    dz.addEventListener('dragleave',()=>dz.classList.remove('dragover'));
    dz.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('dragover');handler(e.dataTransfer.files);});
    inp.addEventListener('change',e=>{handler(e.target.files);e.target.value='';});
}
wireDropzone('p_dropzone','p_gallery',files=>uploadImagesTo(files,galleryImages,document.getElementById('p_dropzone'),renderGalleryList));
wireDropzone('c_dropzone','c_gallery',files=>uploadImagesTo(files,careerGallery,document.getElementById('c_dropzone'),renderCareerGallery));
document.getElementById('p_image').addEventListener('change',async e=>{

        if(!res.ok)throw new Error(data.error||'업로드 실패');
        uploadedUrl=data.url;

        prev.src=data.url;prev.classList.remove('hidden');

    }catch(err){toast(err.message);}
});

document.getElementById('s_video').addEventListener('change',async e=>{
    const files=[...e.target.files];
    if(!files.length)return;
    const busy=document.getElementById('s_videoBusy');
    busy.classList.remove('hidden');
    for(const file of files){
        const fd=new FormData();fd.append('image',file);
        try{
            const res=await fetch('/api/upload',{method:'POST',body:fd});
            const data=await res.json();
            if(!res.ok)throw new Error(data.error||'업로드 실패');
            siteVideos.push(data.url);
        }catch(err){toast(file.name+': '+err.message);}
    }
    busy.classList.add('hidden');
    renderVideoList();
    toast('업로드 완료 — 저장을 눌러야 반영돼');
    e.target.value='';
});

    const regenOtp=document.getElementById('r_regenOtp').checked;
    if(!/^\d{6}$/.test(code))return toast('인증코드 6자리를 입력해');
    if(!newPassword&&!regenOtp)return toast('새 비밀번호 입력 또는 OTP 재발급 중 하나는 선택해야 해');
    try{
        const r=await api('/reset/confirm',{method:'POST',body:JSON.stringify({code,newPassword:newPassword||undefined,regenOtp})});
        document.getElementById('resetStep2').classList.add('hidden');
        document.getElementById('resetStep3').classList.remove('hidden');
        if(r.otpSecret){
            document.getElementById('resetOtpResult').classList.remove('hidden');
            document.getElementById('resetOtpSecret').textContent=r.otpSecret;
        }
        // OTP 입력칸 표시 갱신
        fetch('/api/login-config').then(x=>x.json()).then(c=>{
            document.getElementById('otp').classList.toggle('hidden',!c.otpRequired);
        }).catch(()=>{});
    }catch(e){toast(e.message);}
};

/* ─── modal helpers ─── */
function closeModal(id){document.getElementById(id).classList.remove('open');}
document.querySelectorAll('.modal-bg').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('open');}));

/* ─── init ─── */
(async()=>{
    const me=await fetch('/api/me').then(r=>r.json()).catch(()=>({admin:false}));
    if(me.admin){showAdmin();loadAll();}
    else showLogin();
})();
</script>
