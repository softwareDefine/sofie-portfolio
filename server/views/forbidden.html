<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>접근 차단</title>
<link rel="icon" type="image/svg+xml" href="/%EC%86%8C%ED%94%BC%EB%A1%9C%EA%B3%A0.svg">
<link href="https://hangeul.pstatic.net/hangeul_static/css/NanumSquare Neo.css" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
    font-family:'NanumSquare Neo',-apple-system,sans-serif;
    background:#0b0f1a;color:#fff;
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    -webkit-font-smoothing:antialiased;
}
.box{text-align:center;padding:0 24px}
.box img{height:38px;opacity:.5;margin-bottom:34px}
.code-row{display:flex;align-items:center;justify-content:center;gap:20px;margin-bottom:6px}
.code{
    font-size:5.5rem;font-weight:800;letter-spacing:-0.04em;line-height:1;
    background:linear-gradient(180deg, rgba(255,80,80,.9) 0%, rgba(255,80,80,.45) 100%);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;
}
.code-label{font-size:.65rem;font-weight:600;letter-spacing:.25em;color:rgba(255,80,80,.6);text-transform:uppercase;margin-bottom:26px}
.lock svg{display:block;width:68px;height:68px}
h1{font-size:1.25rem;font-weight:700;margin-bottom:10px}
p{font-size:.82rem;color:rgba(255,255,255,.35);line-height:1.7}
a{display:inline-block;margin-top:28px;padding:10px 28px;border-radius:100px;
  font-size:.75rem;font-weight:600;color:#1d1d1f;background:#fff;text-decoration:none;transition:all .3s}
a:hover{background:rgba(255,255,255,.85);transform:translateY(-1px)}
</style>
</head>
<body>
<div class="box">
    <img src="/소피로고.svg" alt="sofie">
    <div class="code-row">
        <div class="code">403</div>
        <div class="lock">
            <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="rgba(255,80,80,0.9)"/>
                        <stop offset="100%" stop-color="rgba(255,80,80,0.45)"/>
                    </linearGradient>
                </defs>
                <circle cx="50" cy="50" r="42" stroke="url(#fade)" stroke-width="9"/>
                <path d="M34 34 L66 66 M66 34 L34 66" stroke="url(#fade)" stroke-width="9" stroke-linecap="round"/>
            </svg>
        </div>
    </div>
    <div class="code-label">Forbidden</div>
    <h1>지정되지 않은 접근입니다</h1>
    <p>이 페이지는 허용된 네트워크에서만 접근할 수 있습니다.</p>
    <a href="/">메인으로 돌아가기</a>
</div>
</body>
</html>
