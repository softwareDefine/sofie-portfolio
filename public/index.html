<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sofie</title>
    <link rel="icon" type="image/svg+xml" href="/%EC%86%8C%ED%94%BC%EB%A1%9C%EA%B3%A0.svg">
<link href="https://hangeul.pstatic.net/hangeul_static/css/NanumSquare Neo.css" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: 'NanumSquare Neo', -apple-system, 'Helvetica Neue', sans-serif;
            background: #0b0f1a;
            color: #fff;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* ─── BACKGROUND ─── */
        .bg {
            position: absolute; inset: 0; z-index: 0;
            background: #0a0e1a;
            overflow: hidden;
        }
        .bg video {
            position: absolute; inset: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 1.5s ease;
        }
        .bg video.active { opacity: 0.35; }
        .bg::after {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(180deg, rgba(8,12,24,0.5) 0%, rgba(8,12,24,0.7) 100%);
        }

        .page { position: relative; z-index: 1; }

        .below-hero {
            position: relative;
            background: #0a0e1a;
        }

        /* ─── HERO (FULL VIEWPORT) ─── */
        .hero {
            min-height: 100vh;
            display: flex; flex-direction: column;
            justify-content: center;
            padding: 0 6vw;
            position: relative;
            overflow: hidden;
            background: #0a0e1a;
        }

        /* ─── LOGO ─── */
        .logo {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2;
        }
        .logo span {
            font-size: 1.3rem;
            font-weight: 300;
            letter-spacing: 0.25em;
            color: rgba(255,255,255,0.55);
        }

        /* ─── HERO CONTENT ─── */
        .hero-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
            align-items: center;
            padding-bottom: 0;
            max-width: 900px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        /* LEFT */
        .hero-left {}
        .hero-left .sub {
            font-size: 0.7rem;
            color: rgba(255,255,255,0.3);
            letter-spacing: 0.03em;
            margin-bottom: 12px;
        }
        .hero-left h1 {
            font-size: 2.6rem;
            font-weight: 700;
            line-height: 1.3;
            letter-spacing: -0.01em;
            margin-bottom: 14px;
        }
        .hero-left .desc {
            font-size: 0.92rem;
            color: #fff;
            line-height: 1.7;
            margin-bottom: 28px;
            max-width: 380px;
        }
        .hero-left .cta {
            display: inline-block;
            padding: 10px 28px;
            border-radius: 100px;
            font-size: 0.75rem;
            font-weight: 600;
            color: #1d1d1f;
            text-decoration: none;
            background: #fff;
            border: none;
            transition: all 0.3s;
        }
        .hero-left .cta:hover {
            background: rgba(255,255,255,0.85);
            transform: translateY(-1px);
        }
        /* ─── 햄버거 메뉴 / 사이트맵 드로어 ─── */
        .menu-btn {
            position: fixed; top: 24px; left: 24px; z-index: 120;
            width: 48px; height: 48px; /* 터치 영역 확보용 (배경 없음) */
            border: none; background: none;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
            cursor: pointer;
        }
        .menu-btn span {
            display: block; width: 22px; height: 2px; border-radius: 2px;
            background: rgba(255,255,255,0.8);
            box-shadow: 0 1px 4px rgba(0,0,0,0.45); /* 밝은 배경 대비용 미세 그림자 */
            transition: all 0.25s;
        }
        .menu-btn:hover span { background: #fff; width: 25px; }
        .drawer-bg {
            position: fixed; inset: 0; z-index: 130;
            background: rgba(6,9,17,0.55); backdrop-filter: blur(20px) saturate(.8);
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
            display: flex; align-items: center; justify-content: center;
            overflow-y: auto; padding: 40px 20px;
        }
        .drawer-bg.open { opacity: 1; pointer-events: auto; }
        .launcher {
            text-align: center; max-width: 600px; width: 100%;
            transform: translateY(14px) scale(.98); transition: transform 0.32s cubic-bezier(.22,.8,.3,1);
        }
        .drawer-bg.open .launcher { transform: none; }
        .launcher .lc-logo { height: 30px; margin-bottom: 8px; }
        .launcher .lc-sub {
            font-size: 0.62rem; letter-spacing: 0.28em; text-transform: uppercase;
            color: rgba(255,255,255,0.28); margin-bottom: 36px;
        }
        .svc-grid {
            display: flex; flex-wrap: wrap; justify-content: center; align-items: center;
            gap: 14px 44px;
        }
        .svc {
            font-size: 1.15rem; font-weight: 700; letter-spacing: -0.01em;
            color: rgba(255,255,255,0.55); text-decoration: none;
            padding: 6px 2px; position: relative; transition: color 0.22s;
        }
        .svc::after {
            content: ''; position: absolute; left: 0; right: 100%; bottom: 0;
            height: 2px; border-radius: 2px; background: #7eb8ff;
            transition: right 0.25s ease;
        }
        .svc:hover { color: #fff; }
        .svc:hover::after { right: 0; }
        .svc-empty { font-size: 0.78rem; color: rgba(255,255,255,0.25); padding: 20px 0; }

        /* RIGHT — STATS */
        .hero-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 0;
        }
        .stat {
            text-align: right;
            padding: 20px 0;
            width: 240px;
        }
        .stat .label {
            font-size: 0.85rem;
            color: #fff;
            margin-bottom: 6px;
            letter-spacing: 0.01em;
        }
        .stat .number {
            font-size: 4.2rem;
            font-weight: 800;
            letter-spacing: -0.04em;
            line-height: 1.1;
            color: #fff;
        }
        .stat .number small {
            font-size: 1rem;
            font-weight: 400;
            color: rgba(255,255,255,0.35);
            margin-left: 2px;
        }

        /* ─── BELOW HERO SECTIONS ─── */
        .sec {
            max-width: 1100px; margin: 0 auto;
            padding: 80px 6vw;
        }
        .sec-label {
            font-size: 0.6rem; text-transform: uppercase;
            letter-spacing: 0.15em; color: rgba(255,255,255,0.2);
            margin-bottom: 6px;
        }
        .sec-h {
            font-size: 1.5rem; font-weight: 600; margin-bottom: 2.5rem;
            color: rgba(255,255,255,0.9);
        }
        .sep { max-width: 1100px; margin: 0 auto; padding: 0 6vw; }
        .sep hr { border: none; height: 1px; background: rgba(255,255,255,0.04); }

        /* ABOUT */
        .about-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 3rem; }
        .profile-photo {
            width: 200px; height: 200px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255,255,255,0.1);
            margin-bottom: 1.2rem;
        }
        .about-text p { font-size: 0.85rem; color: rgba(255,255,255,0.42); line-height: 1.85; margin-bottom: 0.7rem; }
        .about-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        .ac { padding: 1.1rem; border-radius: 10px; background: rgba(255,255,255,0.025); border: 1px solid rgba(255,255,255,0.04); transition: all 0.3s; }
        .ac:hover { background: rgba(255,255,255,0.05); transform: translateY(-2px); }
        .ac .ic { font-size: 1.2rem; margin-bottom: 6px; }
        .ac h4 { font-size: 0.78rem; font-weight: 600; color: rgba(255,255,255,0.75); margin-bottom: 2px; }
        .ac p { font-size: 0.68rem; color: rgba(255,255,255,0.28); margin: 0; }

        /* SKILLS — marquee */
        .marquee-wrap { overflow: hidden; position: relative; padding: 1rem 0; }
        .marquee-wrap::before, .marquee-wrap::after {
            content: ''; position: absolute; top: 0; bottom: 0; width: 80px; z-index: 1;
        }
        .marquee-wrap::before { left: 0; background: linear-gradient(to right, #0a0e1a, transparent); }
        .marquee-wrap::after { right: 0; background: linear-gradient(to left, #0a0e1a, transparent); }
        .marquee-track {
            display: flex; gap: 14px; width: max-content;
            animation: marquee 28s linear infinite;
        }
        .marquee-track:hover { animation-play-state: paused; }
        .marquee-reverse { animation: marquee-r 28s linear infinite; }
        @keyframes marquee-r { from { transform: translateX(-50%); } to { transform: translateX(0); } }
        @keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
        .skt {
            font-size: 0.88rem; padding: 12px 28px; border-radius: 12px;
            background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06);
            color: rgba(255,255,255,0.55); white-space: nowrap; transition: all 0.2s;
        }
        .skt:hover { color: #7eb8ff; background: rgba(100,180,255,0.06); border-color: rgba(100,180,255,0.12); }

        /* CAREER TIMELINE */
        .tl-layout { display: grid; grid-template-columns: 80px 1fr; gap: 2rem; }
        .tl-years {
            display: flex; flex-direction: column; gap: 0;
        }
        .tl-yr {
            padding: 7px 0;
            font-size: 1.05rem; font-weight: 500; font-family: inherit;
            background: none; border: none;
            color: rgba(255,255,255,0.25); cursor: pointer;
            text-align: left; transition: color 0.2s;
        }
        .tl-yr:hover { color: rgba(255,255,255,0.6); }

        .tl-yr[data-year="core"] { --c: 255,255,255; }
        .tl-yr[data-year="core"] {
            background: linear-gradient(90deg, #ff6b6b, #ffd93d, #6bcb77, #4d96ff, #ff6b6b);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: coreShine 3s linear infinite;
        }
        .tl-yr[data-year="core"].active {
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }
        @keyframes coreShine {
            0% { background-position: 0% 50%; }
            100% { background-position: 300% 50%; }
        }
        .tl-panel[data-year="core"] li {
            border-left: 2px solid rgba(212, 175, 55, 0.4) !important;
        }
        .tl-panel[data-year="core"] li::before {
            background: #d4af37 !important;
            box-shadow: 0 0 8px rgba(212, 175, 55, 0.6);
        }
        .core-title {
            background: linear-gradient(90deg, #ff6b6b, #ffd93d, #6bcb77, #4d96ff, #ff6b6b);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: coreShine 3s linear infinite;
        }
        .tl-yr[data-year="2026"] { --c: 100,180,255; }
        .tl-yr[data-year="2025"] { --c: 130,160,255; }
        .tl-yr[data-year="2024"] { --c: 160,120,255; }
        .tl-yr[data-year="2023"] { --c: 190,100,240; }
        .tl-yr[data-year="2022"] { --c: 220,90,200; }
        .tl-yr[data-year="2021"] { --c: 240,100,160; }
        .tl-yr[data-year="2020"] { --c: 255,110,120; }
        .tl-yr[data-year="2019"] { --c: 255,140,90; }
        .tl-yr[data-year="2018"] { --c: 255,170,60; }
        .tl-yr[data-year="2017"] { --c: 255,200,50; }
        .tl-yr[data-year="2016"] { --c: 200,220,60; }
        .tl-yr[data-year="2013"] { --c: 160,230,100; }

        .tl-yr.active { color: rgb(var(--c)); font-weight: 700; }
        .tl-content { position: relative; min-height: 120px; }
        .tl-panel[data-year="core"] ul {
            columns: 2;
            column-gap: 2rem;
        }
        .tl-panel {
            display: none;
            animation: fadeUp 0.4s ease;
        }
        .tl-panel.active { display: block; }
        .tl-panel h3 { font-size: 1.3rem; font-weight: 700; color: #fff; margin-bottom: 12px; }
        .tl-panel ul { list-style: none; }
        .tl-panel li {
            font-size: 0.85rem; color: rgba(255,255,255,0.5);
            padding: 6px 0 6px 16px; position: relative;
            border-left: 2px solid rgba(100,180,255,0.15);
        }
        .tl-panel li::before {
            content: ''; position: absolute; left: -5px; top: 12px;
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--dot, #7eb8ff);
        }
        .tl-panel li strong { font-size: 0.95rem; }
        .tl-panel li.tl-clk { cursor: pointer; transition: background 0.2s; }
        .tl-panel li.tl-clk:hover { background: rgba(255,255,255,0.03); }
        .tl-panel li.tl-clk:hover strong, .tl-panel li.tl-clk:hover { color: #fff; }
        .tl-more { color: rgba(126,184,255,0.45); font-size: 0.72rem; }
        .tl-clk:hover .tl-more { color: #7eb8ff; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

        /* PROJECTS — cards */
        .pj-filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; }
        .pj-filter {
            font-family: inherit; font-size: 0.72rem; padding: 7px 16px; border-radius: 100px;
            background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06);
            color: rgba(255,255,255,0.45); cursor: pointer; transition: all 0.2s;
        }
        .pj-filter:hover { color: rgba(255,255,255,0.85); border-color: rgba(255,255,255,0.14); }
        .pj-filter.active { background: #fff; color: #111; font-weight: 700; border-color: #fff; }
        .pj-filter .caret { display: inline-block; font-size: 0.85rem; opacity: 0.65; margin-left: 2px; vertical-align: -1px; transition: transform 0.25s; }
        .pj-filter .caret.up { transform: rotate(180deg); }
        .pj-subfilters {
            display: flex; flex-wrap: wrap; gap: 6px;
            margin: -8px 0 20px; padding: 12px 14px;
            border-radius: 12px;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            animation: fadeUp 0.25s ease;
        }
        .pjc-award { font-size: 0.63rem; font-weight: 600; padding: 3px 8px; border-radius: 5px; background: rgba(255,217,61,0.1); color: #ffd93d; }
        .pj-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        a.pjc { display: block; color: inherit; text-decoration: none; cursor: pointer; }
        .pjc-year.featured { color: #ffd93d; }
        .pj-more { text-align: center; margin-top: 22px; }
        .pj-more button {
            font-family: inherit; font-size: 0.75rem; font-weight: 600; padding: 10px 26px;
            border-radius: 100px; background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.09); color: rgba(255,255,255,0.6);
            cursor: pointer; transition: all 0.2s;
        }
        .pj-more button:hover { background: rgba(255,255,255,0.1); color: #fff; }
        .pjc {
            border-radius: 14px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.3s;
            overflow: hidden;
        }
        .pjc:hover { border-color: rgba(255,255,255,0.12); transform: translateY(-3px); background: rgba(255,255,255,0.05); }
        .pjc-img {
            width: 100%; height: 130px;
            object-fit: cover;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: block;
        }
        .pjc-img-placeholder {
            width: 100%; height: 130px;
            display: flex; align-items: center; justify-content: center;
            background: rgba(255,255,255,0.02);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            color: rgba(255,255,255,0.12);
            font-size: 0.75rem;
        }
        .pjc-body { padding: 1.15rem 1.25rem 1.25rem; }
        .pjc-year { font-size: 0.65rem; font-weight: 700; color: #7eb8ff; letter-spacing: 0.05em; margin-bottom: 9px; }
        .pjc h3 { font-size: 0.89rem; font-weight: 700; color: rgba(255,255,255,0.88); line-height: 1.45; margin-bottom: 6px; }
        .pjc-body p { font-size: 0.73rem; color: rgba(255,255,255,0.38); line-height: 1.65; margin-bottom: 12px; }
        .pjc-tags { display: flex; flex-wrap: wrap; gap: 5px; }
        .pjc-tags span { font-size: 0.63rem; font-weight: 500; padding: 4px 9px; border-radius: 5px; background: rgba(100,180,255,0.07); color: #7eb8ff; }

        /* EXP */
        .exp-list { display: flex; flex-direction: column; gap: 6px; }
        .exc { padding: 1.3rem 1.5rem; border-radius: 10px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.04); border-left: 2px solid rgba(100,180,255,0.35); }
        .exc .yr { font-size: 0.68rem; font-weight: 600; color: #7eb8ff; }
        .exc h3 { font-size: 0.9rem; font-weight: 600; color: rgba(255,255,255,0.8); margin: 2px 0; }
        .exc .co { font-size: 0.75rem; color: rgba(255,255,255,0.25); margin-bottom: 6px; }
        .exc ul { list-style: none; }
        .exc li { font-size: 0.75rem; color: rgba(255,255,255,0.35); padding: 2px 0 2px 12px; position: relative; }
        .exc li::before { content:''; position:absolute; left:0; top:8px; width:3px; height:3px; border-radius:50%; background:rgba(255,255,255,0.15); }

        /* CONTACT */
        .ct-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 3rem; }
        .ctl h3 { font-size: 1.05rem; font-weight: 600; margin-bottom: 6px; }
        .ctl > p { font-size: 0.82rem; color: rgba(255,255,255,0.35); line-height: 1.7; margin-bottom: 1.5rem; }
        .ct-links { display: flex; flex-direction: column; gap: 4px; }
        .cta2 { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; color: rgba(255,255,255,0.35); text-decoration: none; padding: 5px 6px; border-radius: 6px; transition: all 0.2s; }
        .cta2:hover { background: rgba(255,255,255,0.03); color: rgba(255,255,255,0.7); }
        .ct-ic { width: 28px; height: 28px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.05); }
        .ct-form { display: flex; flex-direction: column; gap: 5px; }
        .ct-form input, .ct-form textarea { padding: 9px 12px; border-radius: 6px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); font-size: 0.8rem; font-family: inherit; color: rgba(255,255,255,0.75); outline: none; transition: all 0.2s; }
        .ct-form input::placeholder, .ct-form textarea::placeholder { color: rgba(255,255,255,0.18); }
        .ct-form input:focus, .ct-form textarea:focus { border-color: rgba(100,180,255,0.25); }
        .ct-form textarea { min-height: 90px; resize: vertical; }
        .ct-btn { padding: 9px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.7); font-size: 0.8rem; font-weight: 500; font-family: inherit; cursor: pointer; transition: all 0.3s; }
        .ct-btn:hover { background: rgba(255,255,255,0.1); }

        footer {
            text-align: center; padding: 50px 2rem 30px;
        }
        footer img { height: 24px; opacity: 0.2; margin-bottom: 10px; }
        footer p { font-size: 0.65rem; color: rgba(255,255,255,0.12); }

        /* ─── SCROLL INDICATOR ─── */
        .scroll-hint {
            position: absolute;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%);
            display: flex; flex-direction: column; align-items: center; gap: 8px;
            color: rgba(255,255,255,0.25);
            font-size: 0.6rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            z-index: 2;
        }
        .scroll-hint .mouse {
            width: 20px; height: 32px;
            border: 1.5px solid rgba(255,255,255,0.25);
            border-radius: 10px;
            position: relative;
        }
        .scroll-hint .mouse::after {
            content: '';
            position: absolute;
            top: 6px; left: 50%;
            transform: translateX(-50%);
            width: 2px; height: 6px;
            border-radius: 1px;
            background: rgba(255,255,255,0.4);
            animation: scrollDot 1.8s ease-in-out infinite;
        }
        @keyframes scrollDot {
            0% { opacity: 1; top: 6px; }
            50% { opacity: 0.3; top: 16px; }
            100% { opacity: 1; top: 6px; }
        }

        .reveal { opacity: 0; transform: translateY(12px); transition: opacity 0.6s, transform 0.6s; }
        .reveal.v { opacity: 1; transform: none; }

        /* PROJECT DETAIL POPUP */
        .pjm-bg{
            position:fixed;inset:0;z-index:100;
            background:rgba(6,9,17,.88);backdrop-filter:blur(14px) saturate(.6);
            display:none;align-items:flex-start;justify-content:center;
            overflow-y:auto;padding:6vh 16px;
        }
        .pjm-bg.open{display:flex}
        .pjm{
            background:#0f1626;border:1px solid rgba(255,255,255,.09);
            border-radius:18px;max-width:760px;width:100%;
            padding:38px 42px 34px;position:relative;margin-bottom:6vh;
            box-shadow:0 24px 80px rgba(0,0,0,.55);
            animation:fadeUp .35s ease;
        }
        .pjm-close{
            position:absolute;top:14px;right:16px;
            background:none;border:none;color:rgba(255,255,255,.35);
            font-size:1.3rem;cursor:pointer;padding:6px;line-height:1;transition:color .2s;
        }
        .pjm-close:hover{color:#fff}
        .pjm .d-year{font-size:.72rem;font-weight:700;color:#7eb8ff;letter-spacing:.08em;margin-bottom:8px}

        .pjm .d-desc{font-size:.88rem;color:rgba(255,255,255,.45);line-height:1.7;margin-bottom:14px}
        .pjm .d-tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px}
        .pjm .d-tags span{font-size:.66rem;font-weight:500;padding:4px 10px;border-radius:6px;background:rgba(100,180,255,.08);color:#7eb8ff}
        .pjm .d-links a{
            display:inline-block;font-size:.72rem;padding:7px 16px;border-radius:100px;
            background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);
            color:rgba(255,255,255,.7);text-decoration:none;transition:all .2s;
        }
        .pjm .d-links a:hover{background:rgba(255,255,255,.1);color:#fff}
        .pjm .d-divider{height:1px;background:rgba(255,255,255,.05);margin:22px 0}

        .pjm .g-thumbs{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}

        .pjm .d-foot a{font-size:.7rem;color:rgba(255,255,255,.3);text-decoration:none}
        .pjm .d-foot a:hover{color:#7eb8ff}

        /* markdown (팝업 본문) */
        .md{font-size:.88rem;line-height:1.85;color:rgba(255,255,255,.6)}
        .md h1,.md h2,.md h3,.md h4{color:rgba(255,255,255,.92);font-weight:700;margin:1.6em 0 .5em;line-height:1.4}
        .md h1{font-size:1.3rem}
        .md h2{font-size:1.1rem;padding-bottom:.35em;border-bottom:1px solid rgba(255,255,255,.06)}
        .md h3{font-size:.96rem}
        .md p{margin:.7em 0}
        .md ul,.md ol{margin:.7em 0;padding-left:1.5em}
        .md li{margin:.25em 0}

        .md code{font-family:Consolas,'SF Mono',monospace;font-size:.84em;padding:2px 6px;border-radius:5px;background:rgba(255,255,255,.07);color:#ffd93d}
        .md pre{margin:.9em 0;padding:14px 16px;border-radius:10px;overflow-x:auto;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.05)}
        .md pre code{padding:0;background:none;color:rgba(255,255,255,.75)}

        .md img{max-width:100%;border-radius:10px;border:1px solid rgba(255,255,255,.06);margin:.5em 0}
        .md hr{border:none;height:1px;background:rgba(255,255,255,.07);margin:1.8em 0}
        .md table{border-collapse:collapse;margin:.9em 0;width:100%}
        .md th,.md td{padding:7px 11px;border:1px solid rgba(255,255,255,.08);font-size:.82rem}
        .md th{background:rgba(255,255,255,.04);color:rgba(255,255,255,.8)}
        .md .empty{color:rgba(255,255,255,.25);text-align:center;padding:20px 0}

        @media (max-width: 600px){
            .pjm{padding:28px 22px 24px}
            .pjm h2{font-size:1.25rem}
        }

        /* PAGE INDICATOR */
        .page-ind {
            position: fixed; right: 28px; top: 50%; transform: translateY(-50%);
            z-index: 99; display: flex; flex-direction: column; align-items: flex-end; gap: 6px;
            opacity: 0; transition: opacity 0.4s;
        }
        .page-ind.show { opacity: 1; }
        .page-ind a {
            text-decoration: none;
            font-size: 0.65rem; font-weight: 500;
            color: rgba(255,255,255,0.1);
            transition: all 0.35s;
            line-height: 1;

        .page-ind a.near { color: rgba(255,255,255,0.2); font-size: 0.7rem; }
        .page-ind a.active {
            color: #fff; font-size: 0.85rem; font-weight: 700;
        }

        /* ─── TABLET ─── */
        @media (max-width: 1024px) {
            .pj-cards { grid-template-columns: repeat(2, 1fr); }
            .hero { padding: 0 2rem; }
            .hero-content { max-width: 100%; gap: 2rem; }
            .stat .number { font-size: 2.6rem; }

        /* ─── MOBILE ─── */

            .hero-content { grid-template-columns: 1fr; gap: 2.5rem; align-items: center; text-align: center; }
            .logo { top: 24px; }

            .about-cards { grid-template-columns: 1fr 1fr; }
            .ct-cols { grid-template-columns: 1fr; gap: 2rem; }
            .tl-layout { grid-template-columns: 1fr; gap: 1rem; }
            .tl-panel[data-year="core"] ul { columns: 1; }
            .pj-cards { grid-template-columns: 1fr; }
            .tl-years { flex-direction: row; overflow-x: auto; gap: 0; scrollbar-width: none; }
            .tl-years::-webkit-scrollbar { display: none; }
            .tl-yr { padding: 8px 14px; white-space: nowrap; }

        /* ─── SMALL MOBILE ─── */

            .sec-h { font-size: 1.2rem; }
        }
    </style>
</head>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.5/dist/purify.min.js"></script>
<script>
const o=new IntersectionObserver(e=>e.forEach(x=>{if(x.isIntersecting)x.target.classList.add('v')}),{threshold:.08});
document.querySelectorAll('.reveal').forEach(e=>o.observe(e));

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function startCounts(){
    document.querySelectorAll('.count').forEach(el=>{
        const target=+el.dataset.target;
        const duration=1200;
        const start=performance.now();
        function tick(now){
            const p=Math.min((now-start)/duration,1);
            const ease=p<0.5?2*p*p:(1-Math.pow(-2*p+2,2)/2);
            el.textContent=Math.round(ease*target);
            if(p<1)requestAnimationFrame(tick);
            else el.textContent=target;
        }
        requestAnimationFrame(tick);
    });
}

/* ─── 연도별 색상 (동적 생성: 최신=파랑 → 과거=초록) ─── */
function hslToRgb(h,s,l){
    const a=s*Math.min(l,1-l);
    const f=n=>{const k=(n+h/30)%12;return Math.round(255*(l-a*Math.max(-1,Math.min(k-3,9-k,1))))};
    return [f(0),f(8),f(4)];
}
let yrC={};
function buildYearColors(years){
    yrC={};
    const n=years.length;
    years.forEach((y,i)=>{
        const hue=(210+(n>1?i*250/(n-1):0))%360;
        yrC[y]=hslToRgb(hue,0.78,0.7).join(',');
    });
}

function applyTlColor(yr){
    if(yr==='core') return;
    const c=yrC[yr]||'100,180,255';
    const p=document.querySelector('.tl-panel.active');
    if(!p)return;
    p.querySelector('h3').style.color='rgb('+c+')';
    p.querySelectorAll('li').forEach(li=>{
        li.style.borderLeftColor='rgba('+c+',0.2)';
        li.style.setProperty('--dot','rgb('+c+')');
    });
}

function careerLi(c,showYear){
    const yr=showYear?' <span style="color:rgba(255,255,255,0.25);font-size:0.7rem;">'+c.year+'</span>':'';
    const has=c.content&&c.content.trim();
    const body=c.featured?'<strong style="color:#fff;">'+esc(c.title)+'</strong>':esc(c.title);
    if(has)return '<li class="tl-clk" data-id="'+c.id+'" title="자세히 보기">'+body+yr+' <span class="tl-more">↗</span></li>';
    return '<li>'+body+yr+'</li>';
}

function renderTimeline(careers){
    const years=[...new Set(careers.map(c=>c.year))].sort((a,b)=>b-a);
    buildYearColors(years);
    const tlYears=document.getElementById('tlYears');
    const tlContent=document.getElementById('tlContent');

    tlYears.innerHTML='<button class="tl-yr active" data-year="core">핵심경력</button>'
        +years.map(y=>'<button class="tl-yr" data-year="'+y+'" style="--c:'+yrC[y]+'">'+y+'</button>').join('');

    const featured=careers.filter(c=>c.featured);
    let html='<div class="tl-panel active" data-year="core"><h3 class="core-title">핵심경력</h3><ul>'
        +featured.map(c=>careerLi(c,true)).join('')+'</ul></div>';
    years.forEach(y=>{
        const items=careers.filter(c=>c.year===y);
        html+='<div class="tl-panel" data-year="'+y+'"><h3>'+y+'</h3><ul>'
            +items.map(c=>careerLi(c,false)).join('')+'</ul></div>';
    });
    tlContent.innerHTML=html;

    // 본문 있는 경력 → 클릭 시 상세 팝업
    tlContent.querySelectorAll('li.tl-clk').forEach(li=>{
        li.addEventListener('click',()=>openCareer(+li.dataset.id,true));
    });

    document.querySelectorAll('.tl-yr').forEach(btn=>{
        btn.addEventListener('click',()=>{
            document.querySelectorAll('.tl-yr').forEach(b=>b.classList.remove('active'));
            document.querySelectorAll('.tl-panel').forEach(p=>p.classList.remove('active'));
            btn.classList.add('active');
            document.querySelector('.tl-panel[data-year="'+btn.dataset.year+'"]').classList.add('active');
            applyTlColor(btn.dataset.year);
        });
    });
}

// 수상명 → 메달 (대상·금상 🥇 / 은상 🥈 / 동상 🥉 / 장려·입선 🏅 / 그 외 🏆)
function awardIcon(award){
    if(/대상|금상|최우수|1등/.test(award))return '\u{1F947}';
    if(/은상|2등/.test(award))return '\u{1F948}';
    if(/동상|3등/.test(award))return '\u{1F949}';
    if(/장려|입선|특별/.test(award))return '\u{1F3C5}';
    return '\u{1F3C6}';
}

let allProjects=[];
const pjState={kind:'all',value:null,showAll:false}; // kind: all|featured|award|field|purpose
function renderProjects(projects){
    if(projects)allProjects=projects;
    const list=allProjects;

    // 필터 칩: 기본(전체/대표/수상) + 분야/목적은 누르면 아래로 펼쳐짐
    const groups={field:[...new Set(list.map(p=>p.field).filter(Boolean))],
                  purpose:[...new Set(list.map(p=>p.purpose).filter(Boolean))]};
    const groupLabel={field:'분야',purpose:'목적'};
    const chip=(kind,value,label)=>{
        const active=pjState.kind===kind&&pjState.value===value;
        return '<button class="pj-filter'+(active?' active':'')+'" data-kind="'+kind+'" data-value="'+esc(value||'')+'">'+label+'</button>';
    };
    let html=chip('all',null,'전체')+chip('featured',null,'★ 대표')+chip('award',null,'&#127942; 수상');
    for(const g of ['field','purpose']){
        if(!groups[g].length)continue;
        const selected=pjState.kind===g?pjState.value:null;
        const open=pjState.openGroup===g;
        html+='<button class="pj-filter pj-group'+(selected?' active':'')+'" data-group="'+g+'">'
            +groupLabel[g]+(selected?': '+esc(selected):'')
            +' <span class="caret'+(open?' up':'')+'">▾</span></button>';
    }
    document.getElementById('pjFilters').innerHTML=html;

    // 펼쳐진 그룹의 세부 칩
    const sub=document.getElementById('pjSubFilters');
    if(pjState.openGroup&&groups[pjState.openGroup].length){
        sub.style.display='flex';
        sub.innerHTML=groups[pjState.openGroup].map(v=>chip(pjState.openGroup,v,esc(v))).join('');
    }else{
        sub.style.display='none';
        sub.innerHTML='';
    }

    document.querySelectorAll('#pjFilters .pj-filter:not(.pj-group)').forEach(b=>b.onclick=()=>{
        pjState.kind=b.dataset.kind;
        pjState.value=b.dataset.value||null;
        pjState.openGroup=null;
        renderProjects();
    });
    document.querySelectorAll('#pjFilters .pj-group').forEach(b=>b.onclick=()=>{
        pjState.openGroup=pjState.openGroup===b.dataset.group?null:b.dataset.group;
        renderProjects();
    });
    document.querySelectorAll('#pjSubFilters .pj-filter').forEach(b=>b.onclick=()=>{
        pjState.kind=b.dataset.kind;
        pjState.value=b.dataset.value||null;
        renderProjects();
    });

    // 보일 목록 ('전체'만 대표 기본 + 더보기, 나머지 필터는 전체에서 검색)
    let visible=list;
    if(pjState.kind==='featured')visible=list.filter(p=>p.featured);
    else if(pjState.kind==='award')visible=list.filter(p=>p.award);
    else if(pjState.kind==='field')visible=list.filter(p=>p.field===pjState.value);
    else if(pjState.kind==='purpose')visible=list.filter(p=>p.purpose===pjState.value);
    else if(!pjState.showAll){
        visible=list.filter(p=>p.featured);
        if(!visible.length)visible=list; // 대표 지정 전 fallback
    }

    const el=document.getElementById('pjCards');
    el.innerHTML=visible.map(p=>{
        const img=p.image_url
            ?'<img class="pjc-img" src="'+esc(p.image_url)+'" alt="'+esc(p.title)+'">'
            :'<div class="pjc-img-placeholder">&#128247; 이미지 추가</div>';
        const award=p.award?'<span class="pjc-award">'+awardIcon(p.award)+' '+esc(p.award)+'</span>':'';
        const tags=award+(p.tags||[]).map(t=>'<span>'+esc(t)+'</span>').join('');
        return '<a class="pjc" href="/project/'+p.id+'" data-id="'+p.id+'">'+img+'<div class="pjc-body"><div class="pjc-year'+(p.featured?' featured':'')+'">'+p.year+'</div>'
            +'<h3>'+esc(p.title)+'</h3><p>'+esc(p.description||'')+'</p>'
            +'<div class="pjc-tags">'+tags+'</div></div></a>';
    }).join('');
    // 클릭 → 팝업 (새 탭/휠클릭은 그대로 단독 페이지)
    el.querySelectorAll('.pjc').forEach(a=>a.addEventListener('click',e=>{
        if(e.metaKey||e.ctrlKey||e.shiftKey)return;
        e.preventDefault();
        openProject(+a.dataset.id,true);
    }));

    // 더보기 버튼: '전체'에서 대표 외 항목이 있을 때만
    const more=document.getElementById('pjMore');
    const hiddenCount=list.length-list.filter(p=>p.featured).length;
    if(pjState.kind==='all'&&list.filter(p=>p.featured).length&&hiddenCount>0){
        more.style.display='block';
        document.getElementById('pjMoreBtn').textContent=pjState.showAll
            ?'대표 프로젝트만 보기 ↑'
            :'전체 '+list.length+'개 보기 ↓';
    }else{
        more.style.display='none';
    }
}
document.getElementById('pjMoreBtn').onclick=()=>{
    pjState.showAll=!pjState.showAll;
    renderProjects();
};

/* ─── 상세 팝업 (프로젝트/경력 공용) ─── */
const pjmBg=document.getElementById('pjmBg');
let detailBack='/#projects'; // 닫을 때 돌아갈 위치

function fillDetailGallery(imgs){
    const g=document.getElementById('dGallery');
    if(imgs.length){
        g.style.display='block';
        const main=document.getElementById('dgMain');
        main.src=imgs[0];
        main.onclick=()=>window.open(main.src,'_blank');
        const thumbs=document.getElementById('dgThumbs');
        thumbs.innerHTML=imgs.length>1?imgs.map((u,i)=>'<img src="'+esc(u)+'" data-i="'+i+'" class="'+(i===0?'active':'')+'">').join(''):'';
        thumbs.querySelectorAll('img').forEach(t=>t.onclick=()=>{
            main.src=imgs[+t.dataset.i];
            thumbs.querySelectorAll('img').forEach(x=>x.classList.remove('active'));
            t.classList.add('active');
        });
    }else{
        g.style.display='none';
    }
}
function showDetail(){
    pjmBg.classList.add('open');
    pjmBg.scrollTop=0;
    document.body.style.overflow='hidden';
}
function fillDetailContent(md){
    document.getElementById('dContent').innerHTML=(md||'').trim()
        ?DOMPurify.sanitize(marked.parse(md))
        :'<p class="empty">아직 작성된 내용이 없습니다.</p>';
}

async function openProject(id,push){
    let p;
    try{
        const res=await fetch('/api/projects/'+id);
        if(!res.ok)throw new Error();
        p=await res.json();
    }catch(e){return;}

    detailBack='/#projects';
    document.getElementById('dYear').textContent=p.year;
    document.getElementById('dTitle').textContent=p.title;
    document.getElementById('dDesc').textContent=p.description||'';
    document.getElementById('dTags').innerHTML=(p.award?'<span style="background:rgba(255,217,61,.1);color:#ffd93d">'+awardIcon(p.award)+' '+esc(p.award)+'</span>':'')
        +(p.tags||[]).map(t=>'<span>'+esc(t)+'</span>').join('');
    document.getElementById('dLinks').innerHTML=p.link_url
        ?'<a href="'+esc(p.link_url)+'" target="_blank" rel="noopener">프로젝트 링크 ↗</a>':'';
    document.getElementById('dPermalink').href='/project/'+p.id;
    fillDetailGallery((p.images&&p.images.length)?p.images:(p.image_url?[p.image_url]:[]));
    fillDetailContent(p.content);
    showDetail();
    if(push)history.pushState({project:id},'','/project/'+id);
}

async function openCareer(id,push){
    let c;
    try{
        const res=await fetch('/api/careers/'+id);
        if(!res.ok)throw new Error();
        c=await res.json();
    }catch(e){return;}

    detailBack='/#exp';
    document.getElementById('dYear').textContent=c.year;
    document.getElementById('dTitle').textContent=c.title;
    document.getElementById('dDesc').textContent='';
    document.getElementById('dTags').innerHTML='';
    document.getElementById('dLinks').innerHTML='';
    document.getElementById('dPermalink').href='/career/'+c.id;
    fillDetailGallery(c.images||[]);
    fillDetailContent(c.content);
    showDetail();
    if(push)history.pushState({career:id},'','/career/'+id);
}

function closeDetail(push){
    pjmBg.classList.remove('open');
    document.body.style.overflow='';
    if(push)history.pushState({},'',detailBack);
}
document.getElementById('pjmClose').onclick=()=>closeDetail(true);
pjmBg.addEventListener('click',e=>{if(e.target===pjmBg)closeDetail(true);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&pjmBg.classList.contains('open'))closeDetail(true);});
window.addEventListener('popstate',()=>{
    let m=location.pathname.match(/^\/project\/(\d+)$/);
    if(m)return openProject(+m[1],false);
    m=location.pathname.match(/^\/career\/(\d+)$/);
    if(m)return openCareer(+m[1],false);
    closeDetail(false);
});

function renderAbout(s){
    const photo=document.getElementById('aboutPhoto');
    if(s.about_photo){photo.src=s.about_photo;photo.style.display='block';}
    document.getElementById('aboutHeadline').textContent=s.about_headline||'';
    document.getElementById('aboutIntro').textContent=s.about_intro||'';
    const contact=[];
    if(s.about_phone)contact.push('&#128222; '+esc(s.about_phone));
    if(s.about_email)contact.push('&#9993; '+esc(s.about_email));
    document.getElementById('aboutContact').innerHTML=contact.join('<br>');
    // 값: 줄바꿈 + 마크다운 링크 지원
    let rows=[];
    try{rows=JSON.parse(s.about_rows||'[]');}catch(e){}
    const tdL='padding:8px 0;color:rgba(255,255,255,0.35);font-size:0.78rem;vertical-align:top;';
    const tdR='padding:8px 0;font-size:0.88rem;line-height:1.8;';
    const bt='border-top:1px solid rgba(255,255,255,0.05);';
    document.getElementById('aboutTable').innerHTML=rows.map((r,i)=>{
        const val=String(r.value||'').split('\n').map(line=>
            DOMPurify.sanitize(marked.parseInline(line),{ADD_ATTR:['target']})
        ).join('<br>');
        return '<tr><td style="'+tdL+(i?bt:'width:80px;')+'">'+esc(r.label)+'</td>'
            +'<td style="'+tdR+(i?bt:'')+'">'+val+'</td></tr>';
    }).join('');
    document.getElementById('aboutTable').querySelectorAll('a').forEach(a=>{
        a.target='_blank';a.rel='noopener';
        a.style.color='#7eb8ff';a.style.textDecoration='none';
    });
}

function renderStats(settings){
    const map=[['stat_years',0],['stat_projects',1],['stat_activities',2]];
    const counts=document.querySelectorAll('.count');
    map.forEach(([key,i])=>{
        if(settings[key]!==undefined&&counts[i])counts[i].dataset.target=settings[key];
    });
    startCounts();
}

function renderHero(s){
    if(s.hero_title)document.getElementById('heroTitle').textContent=s.hero_title;
    if(s.hero_desc)document.getElementById('heroDesc').textContent=s.hero_desc;
    let clips=[];
    try{clips=JSON.parse(s.hero_videos||'[]');}catch(e){}
    startVideos(clips.length?clips:defaultClips);
    // 운영 서비스 → 런처 타일 ("이모지 이름" → 아이콘 + 라벨 분리)
    let links=[];
    try{links=JSON.parse(s.hero_links||'[]');}catch(e){}
    document.getElementById('drawerLinks').innerHTML=links.filter(l=>l.label&&l.url).map(l=>{
        // "이모지 이름" → 제목만 표시
        const parts=String(l.label).trim().split(' ');
        const name=parts.length>1?parts.slice(1).join(' '):parts[0];
        return '<a class="svc" href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(name)+'</a>';
    }).join('')||'<div class="svc-empty">등록된 서비스 없음 — admin 사이트 탭에서 추가</div>';
}

/* ─── 햄버거 → 중앙 서비스 런처 ─── */
const drawerBg=document.getElementById('drawerBg');
document.getElementById('menuBtn').onclick=()=>drawerBg.classList.add('open');
drawerBg.addEventListener('click',e=>{if(e.target===drawerBg)drawerBg.classList.remove('open');});
document.addEventListener('keydown',e=>{if(e.key==='Escape')drawerBg.classList.remove('open');});

function renderSkills(s){
    let rows=[];
    try{rows=JSON.parse(s.skills_rows||'[]');}catch(e){}
    if(!rows.length)return;
    const wrap=document.getElementById('skillsWrap');
    wrap.innerHTML=rows.map((items,i)=>{
        if(!items.length)return '';
        const seq=Array(6).fill(items).flat(); // 마키 루프용 반복
        return '<div class="marquee-wrap reveal v"><div class="marquee-track'+(i%2?' marquee-reverse':'')+'">'
            +seq.map(t=>'<span class="skt">'+esc(t)+'</span>').join('')+'</div></div>';
    }).join('');
}

(async function loadContent(){
    try{
        const res=await fetch('/api/content');
        if(!res.ok)throw new Error('HTTP '+res.status);
        const data=await res.json();
        renderStats(data.settings);
        renderHero(data.settings);
        renderSkills(data.settings);
        renderAbout(data.settings);
        renderTimeline(data.careers);
        renderProjects(data.projects);
    }catch(e){
        console.error('콘텐츠 로드 실패:',e);
        startCounts();
        startVideos(defaultClips);
    }
})();

const defaultClips=['clip1.mp4','clip2.mp4','clip3.mp4','clip4.mp4'];
let videoStarted=false;
function startVideos(clips){
    if(videoStarted||!clips.length)return;
    videoStarted=true;
    let ci=0;
    const va=document.getElementById('bgA');
    const vb=document.getElementById('bgB');
    let current=va, next=vb;

    function playNext(){
        next.src=clips[ci];
        next.play();
        next.classList.add('active');
        current.classList.remove('active');
        ci=(ci+1)%clips.length;
        const tmp=current; current=next; next=tmp;
    }

    current.addEventListener('ended',playNext);
    next.addEventListener('ended',playNext);
    va.src=clips[ci]; va.play(); va.classList.add('active');
    ci=(ci+1)%clips.length;
}

const indLinks=document.querySelectorAll('.page-ind a');
const sections=['hero','about','skills','exp','projects'];
const indEl=document.querySelector('.page-ind');
let hideTimer=null, snapTimer=null;
window.addEventListener('scroll',()=>{
    let curIdx=0;
    sections.forEach((id,i)=>{
        const el=document.getElementById(id);
        if(el&&el.getBoundingClientRect().top<=window.innerHeight*0.4) curIdx=i;
    });
    indLinks.forEach(a=>{
        const idx=+a.dataset.idx;
        const dist=Math.abs(idx-curIdx);
        a.classList.remove('active','near');
        if(dist===0) a.classList.add('active');
        else if(dist===1) a.classList.add('near');
    });
    indEl.classList.add('show');
    clearTimeout(hideTimer);
    hideTimer=setTimeout(()=>indEl.classList.remove('show'),1500);
    clearTimeout(snapTimer);
    snapTimer=setTimeout(()=>{
        const el=document.getElementById(sections[curIdx]);
        if(el) el.scrollIntoView({behavior:'smooth',block:'start'});
    },300);
});
</script>
